---
- name: git checkout plenv
  ansible.builtin.git:
    repo: https://github.com/tokuhirom/plenv.git
    dest: "{{ plenv_dir }}"
    version: "master"
    force: yes
  become: yes
  become_user: vagrant

- name: edit PATH plenv on .bashrc_alias
  ansible.builtin.lineinfile:
    dest: "{{ home_dir }}/.bashrc_alias"
    line: "export PATH=$HOME/.plenv/bin:$PATH"
    mode: "0644"

- name: edit plenv init on .bashrc_alias
  ansible.builtin.lineinfile:
    dest: "{{ home_dir }}/.bashrc_alias"
    line: "eval \"$(plenv init -)\""
    mode: "0644"

- name: git checkout perl-build
  ansible.builtin.git:
    repo: https://github.com/tokuhirom/Perl-Build.git
    dest: "{{ plenv_dir }}/plugins/perl-build"
    version: "master"
    force: yes
  become: yes
  become_user: vagrant

- name: stat plenv
  ansible.builtin.stat:
    path: "{{ plenv_dir }}/bin/plenv"
  register: is_plenv

- name: exists is_plenv
  when: is_plenv.stat.exists
  block:
  - name: perl installed via plenv
    ansible.builtin.command: "{{ plenv_dir }}/bin/plenv install {{ perl_version | default(5.32.0) }}"
    become: yes
    become_user: vagrant
    register: plenv_result
    failed_when:
      - plenv_result.rc != 0
      - plenv_result.rc != 255

  - name: plenv global
    ansible.builtin.command: "{{ plenv_dir }}/bin/plenv global {{ perl_version | default(5.32.0) }}"
    become: yes
    become_user: vagrant

  - name: plenv rehash
    ansible.builtin.command: "{{ plenv_dir }}/bin/plenv rehash"
    become: yes
    become_user: vagrant

  - name: cpanm module installed
    ansible.builtin.command: "{{ plenv_dir }}/bin/plenv install-cpanm"
    become: yes
    become_user: vagrant

- name: stat cpanm
  ansible.builtin.stat:
    path: "{{ plenv_dir }}/bin/cpm"
  register: is_cpm

- name: not exists is_cpm
  when: not is_cpm.stat.exists
  block:
  - name: cpm module installed
    ansible.builtin.shell: curl -fsSL --compressed https://git.io/cpm > "{{ plenv_dir }}/bin/cpm"

  - name: chmod 755
    ansible.builtin.file:
      path: "{{ plenv_dir }}/bin/cpm"
      mode: "0755"

- name: stat cpanm
  ansible.builtin.stat:
    path: "{{ plenv_dir }}/shims/cpanm"
  register: is_cpanm

- name: exists is_cpanm
  when: is_cpanm.stat.exists
  block:
  - name: Carton module installed
    ansible.builtin.command: "{{ plenv_dir }}/shims/cpanm Carton"
    become: yes
    become_user: vagrant

  - name: Server::Starter module installed
    ansible.builtin.command: "{{ plenv_dir }}/shims/cpanm Server::Starter"
    become: yes
    become_user: vagrant

  - name: App::UpdateCPANfile module installed
    ansible.builtin.command: "{{ plenv_dir }}/shims/cpanm App::UpdateCPANfile"
    become: yes
    become_user: vagrant
